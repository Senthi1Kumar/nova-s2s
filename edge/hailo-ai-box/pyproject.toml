[project]
name = "hailo-ai-box"
version = "0.1.0"
description = "Edge AI inference server for the Raspberry Pi 5 + Hailo-10H"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn[standard]==0.32.1",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "httpx",
    "piper-tts<=1.3.0",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aibox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["pi: needs the Hailo-10H and hailo_platform (skipped on the laptop)"]

[tool.ruff]
line-length = 100
