[project]
name = "nova-hailo"
version = "0.0.1"
description = "Cascaded on-device voice agent for Raspberry Pi 5 + Hailo-10H"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "python-dotenv",
    "sounddevice==0.5.1",
    "soundfile",
    "webrtcvad-wheels",
    "piper-tts<=1.3.0",
    "kokoro-onnx>=0.4.9",
    "requests",
    "psutil",
    "onnxruntime",
    "kaldi_native_fbank",
    "huggingface_hub",
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn[standard]==0.32.1",
    # Live web_search: Exa / Brave / Serper REST via httpx (search_mcp.py).
    # Pipeline does not import the exa-py SDK; set EXA_API_KEY in .env.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# Offline ASR bakeoff only (not required for the demo):
#   uv sync --extra asr-bench
asr-bench = [
    "torch",
    "transformers>=4.49",
    "onnxruntime-genai",
]
# Optional provider A/B script only (scripts/bench_websearch_providers.py):
#   uv sync --extra bench-search
bench-search = ["exa-py"]

[project.scripts]
nova-hailo = "main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nova_hailo*"]

[tool.uv]
# hailo_platform / pyhailort come from system packages (apt)
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["cloned", "hailo-docs", "docs", "asr-bench2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
    "UP038",
]
