# Nova OEM v1.1: the demo profile every Pi runs (CabinEnv cockpit, car tools, search, Workspace).
# Default for: ./scripts/run_demo_oem.sh and run_cabinenv.sh  (NOVA_HAILO_PROFILE=oem)
#
# LLM: cloud gpt-oss-120b (Groq, OpenRouter on failover); the local Hailo Qwen2 is picked in the
# cockpit's Nova sheet. STT: Parakeet TDT 110m (CPU). TTS: Piper. Open mic (no wake word).
# Search: Exa only (HTTP). Deep research: Tavily. Workspace tools need Google OAuth tokens under
# runtime/google_oauth/. GPS is found without config (gpsd, else a USB serial receiver).

model:
  llm_hef: qwen2
  # Hailo 5.3 FC HEF (fetch_models downloads it): llm_hef: qwen2-fc
  # Host router still picks tools; FC is optional 1st-pass experiment, not ToolBroker.
  # Cloud first: the local 1.5B model misses tool calls and answers trip questions from memory.
  # groq here, with OpenRouter taking over on 429/5xx when OPENROUTER_API_KEY is set; a provider
  # with no key gives way to the one that has one. Local Hailo: llm_backend: cpp.
  llm_backend: groq
  # Live-delta A/B: stt_engine: nemo_speech
  # nemo_speech_model: models/nemo_speech/nemotron-speech-streaming-en-0.6b.q8_0.gguf
  # nemo_rnnt_right_context: 1
  stt_engine: parakeet
  parakeet_decoder: tdt
  parakeet_model: models/parakeet/tdt_ctc-110m-f16.gguf
  whisper_hef: base
  # Piper: 311ms to first audio chunk vs Inflect's 467ms on the same replies.
  tts_engine: piper
  inflect_speed: 1.0
  inflect_variation: 0.667
  inflect_seed: 7
  kokoro_voice: af_sarah
  piper_onnx: models/piper/en_US-amy-low.onnx
  max_tokens: 256
  temperature: 0.5
  seed: 42
  no_think: true

llm:
  no_think: true
  # The provider the cockpit's "Cloud" choice uses. gpt-oss-120b measured 3/3 tool calls with
  # 0/3 false fires under the production soul prompt. OpenRouter has no per-minute cap; Groq's
  # free tier answers 429 (rate limit) after a few quick turns.
  cloud_provider: openrouter
  groq_model: openai/gpt-oss-120b

pipeline:
  # Turns kept while a cloud backend is active (local HEFs stay on
  # max_history_turns). Each extra turn is ~90 prompt tokens per request.
  cloud_history_turns: 5
  tool_route_mode: allowlist
  multi_tool_rounds: 1
  clear_context_each_turn: false
  native_context: true
  ctx_compact_ratio: 0.7
  sequential_stt: false
  stream_tts: true
  voice_one_sentence: true
  first_chunk_min_chars: 24
  max_history_turns: 2
  session_idle_sec: 8
  timezone: Asia/Kolkata
  validate_before_speak: true
  genai_serial: true
  # Off by default: OpenRouter tool turns only. When on, a web_search tool
  # pick has Exa itself stream the synthesized spoken answer (type=instant +
  # outputSchema + stream) instead of a second OpenRouter LLM round composing
  # it from raw hits -- see nova_hailo.pipeline._openrouter_turn and
  # nova_hailo.tools.search_mcp.web_search_answer.
  exa_direct_answer: false

auth:
  enabled: false
  payment_keywords: []
  confirm_keywords: []
  deny_keywords: []

voice:
  vad: true
  vad_aggressiveness: 1
  vad_energy_threshold: 0.2
  # Off: enhancement runs ahead of VAD rather than gated behind it, so it
  # spends CPU on noise-only frames and distorts speech onsets. Set to dtln
  # (or NOVA_HAILO_NS=dtln) to A/B it back on.
  ns: off
  ns_strength: 0.5
  no_tts: false
  wait_tts: false
  wait_tts_drain: true
  barge_in_while_speaking: false
  # Keep false until PipeWire AEC soak (docs/pipewire-aec.md). After a 30 min
  # self-barge soak on the Pi, set true on this profile.
  echo_tail_ms: 400
  # Hold STT commit across a short pause so mid-sentence cuts can reopen Nemo.
  reopen_ms: 300
  # Utterance energy gate (nova_hailo.audio_gate.accept_utterance)
  gate_min_rms: 0.010
  gate_min_peak: 0.045
  gate_min_sec: 0.40
  gate_min_speech_frac: 0.15
  # Nemo sidecar post-commit wait (nova_hailo.web.nemo_wait_budget)
  nemo_wait_floor_s: 0.35
  nemo_wait_cap_s: 1.8
  nemo_wait_base_s: 0.25
  nemo_wait_scale: 0.40
  # The client scripts pick the mic and speaker (the XVF3800 when plugged in, else the WM8960);
  # auto here prefers a WM8960 and otherwise takes the default device.
  input_device: auto
  output_device: auto
  playback: browser

web:
  host: 0.0.0.0
  port: 8766

wake:
  mode: ptt                 # open mic: every utterance is a request; kws = say "Nova" first
  kws_enabled: true
  kws_engine: openwakeword
  kws_model: models/wakeword/nova_pro_v3.onnx
  kws_threshold: 0.15
  kws_barge_threshold: 0.10   # lower while TTS is audible (AEC overlap)
  kws_consecutive_hits: 1
  kws_cooldown_s: 1.5

pvad:
  enabled: false
  model_dir: models/FireRedChat-pvad
  barge_in_threshold: 0.55
  barge_in_frames: 2

tools:
  # Read-only tools ON for primary demo (router → broker → fail-closed).
  # jev: TypeSafe semantic router when TYPESAFE_API_KEY is set; regex if not.
  router: jev
  jev_timeout_sec: 0.45
  jev_noul_min: 0.65
  jev_max_actions: 2
  enable_in_prompt: false
  profile: oem_readonly
  enabled: [web_search, deep_research, check_calendar, check_email, list_drive_files, vehicle]
  write_enabled: false
  timeout_sec: 8
  research_poll_timeout_sec: 45
  # Off: spoken news = Exa summary/highlights (complete sentences, max_speak_chars).
  # Flip true to re-enable Qwen rephrase (often echoed the query; not the demo default).
  summarize_search: false
  summarizer_max_tokens: 512
  max_speak_chars: 700
  summarizer_hef: qwen2
  brave_primary: false
  serper_fallback: false

# The online door (LiveKit room). Stays shut, with the reason in the log, until LIVEKIT_URL,
# LIVEKIT_API_KEY and LIVEKIT_API_SECRET are in .env.
livekit:
  wake: session
  enabled: true

cabingym:
  # Vehicle profile: ev_demo (desk) | audi_q7_ice
  profile: ev_demo
  # sim only for now; hybrid (real OBD/GPS read + simulated cabin) comes with the car adapters
  adapter: sim
  # Spoken turn-by-turn from the route. Mute still only closes the mic.
  voice_guidance: true
  # Simulated drive streamed at 10 Hz (speed, gear, GPS, charge) + nova.nav for displays.
  # autoplay: [start, work] drives without a voice command; route_service: auto | mapbox | osrm | off
  sim_drive:
    enabled: true
    cruise_kph: 50
    autoplay: []
    route_service: auto

harness:
  # Frontend/backend split (Qwen-Audio-Agent style). direct = slice-1 behaviour;
  # mixed = parsed turns run on the Pi, plans/vague goals go to the backend agent;
  # delegated = every vehicle turn goes to the backend (benchmark baseline).
  execution: mixed
  # OpenRouter: no per-minute token cap (Groq's free tier starved the planner)
  backend: openrouter
  backend_model: openai/gpt-oss-120b
  max_steps: 6
  budget_s: 20
